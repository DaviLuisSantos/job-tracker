<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Tracker{% if title %} — {{ title }}{% endif %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- DataTables + Bootstrap 5 skin -->
  <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">

  <style>
    body { background: #f0f2f5; font-size: .92rem; }

    /* Navbar */
    .navbar { box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .navbar-brand { font-weight: 800; letter-spacing: -.5px; font-size: 1.1rem; }

    /* Cards */
    .card { border: none; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }

    /* Score badges */
    .score-badge { font-size: .8rem; font-weight: 700; min-width: 36px;
                   display: inline-block; text-align: center; border-radius: 6px; padding: 2px 6px; }
    .score-ex  { background: #198754; color: #fff; }   /* ≥ 80 */
    .score-gd  { background: #20c997; color: #fff; }   /* 70–79 */
    .score-md  { background: #ffc107; color: #212529; } /* 50–69 */
    .score-lo  { background: #adb5bd; color: #fff; }   /* < 50 */

    /* Status badges */
    .st-new       { background:#0d6efd; color:#fff }
    .st-reviewed  { background:#0dcaf0; color:#212529 }
    .st-applied   { background:#198754; color:#fff }
    .st-interview { background:#ffc107; color:#212529 }
    .st-rejected  { background:#dc3545; color:#fff }

    /* Table */
    #jobs-table tbody tr { cursor: pointer; }
    #jobs-table tbody tr:hover { background: #e9f0fb !important; }
    .table td { vertical-align: middle; }

    /* Modal description */
    .desc-box { white-space: pre-wrap; font-size: .85rem;
                max-height: 280px; overflow-y: auto;
                background: #f8f9fa; border-radius: 8px; padding: .75rem; }

    /* Stat cards */
    .kpi-val { font-size: 2rem; font-weight: 800; line-height: 1; }
    .kpi-lbl { font-size: .75rem; color: #6c757d; margin-top: 4px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">
      <i class="bi bi-briefcase-fill me-2 text-info"></i>Job Tracker
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active fw-bold{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/jobs' %}active fw-bold{% endif %}" href="/jobs">
            <i class="bi bi-list-ul me-1"></i>Vagas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/review' %}active fw-bold{% endif %}" href="/review">
            <i class="bi bi-card-checklist me-1"></i>Revisar
          </a>
        </li>
      </ul>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary fw-semibold"
                data-bs-toggle="modal" data-bs-target="#exportModal">
          <i class="bi bi-download me-1"></i>Exportar
        </button>
        <button class="btn btn-sm btn-outline-info fw-semibold"
                data-bs-toggle="modal" data-bs-target="#runModal">
          <i class="bi bi-play-circle-fill me-1"></i>Executar
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<!-- JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

<script>
  // Shared score-class helper
  function scoreClass(s) {
    s = parseInt(s) || 0;
    if (s >= 80) return 'score-ex';
    if (s >= 70) return 'score-gd';
    if (s >= 50) return 'score-md';
    return 'score-lo';
  }
  function fmtNum(n) {
    return Number(n).toLocaleString('en-AU');
  }
</script>
{% block scripts %}{% endblock %}

<!-- ── Modal: Exportar ────────────────────────────────────────────────────── -->
<div class="modal fade" id="exportModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-download text-secondary me-2"></i>Exportar
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small text-muted mb-1">Perfil</label>
          <select id="exp-profile" class="form-select form-select-sm">
            <option value="">Todos os perfis</option>
            {% for p in profile_names %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>
        <div id="exp-min-score-wrap" class="mb-1">
          <label class="form-label small text-muted mb-1">Score mínimo <span class="text-muted">(só IA)</span></label>
          <input type="number" id="exp-min-score" class="form-control form-control-sm"
                 value="0" min="0" max="100">
        </div>
        <div id="exp-result" class="mt-2 small d-none"></div>
      </div>

      <div class="modal-footer gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm"
                data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-outline-success btn-sm" onclick="doExport('excel')">
          <i class="bi bi-file-earmark-excel me-1"></i>Excel
        </button>
        <button class="btn btn-outline-primary btn-sm" onclick="doExport('ai')">
          <i class="bi bi-robot me-1"></i>Para IA
        </button>
      </div>

    </div>
  </div>
</div>

<script>
function doExport(type) {
  const profile  = document.getElementById('exp-profile').value;
  const minScore = document.getElementById('exp-min-score').value;
  let url = `/api/export/${type}`;
  const p = new URLSearchParams();
  if (profile)                       p.set('profile',   profile);
  if (type === 'ai' && minScore > 0) p.set('min_score', minScore);
  if (p.toString()) url += '?' + p.toString();

  const res = document.getElementById('exp-result');
  res.className = 'mt-2 small text-muted';
  res.textContent = 'Gerando arquivo…';

  // Usa fetch para detectar erro (JSON) vs arquivo (download)
  fetch(url)
    .then(r => {
      const ct = r.headers.get('Content-Type') || '';
      if (ct.includes('json')) {
        return r.json().then(d => { throw new Error(d.error || 'Erro desconhecido'); });
      }
      return r.blob().then(blob => {
        const cd  = r.headers.get('Content-Disposition') || '';
        const m   = cd.match(/filename[^;=\n]*=["']?([^"';\n]+)/i);
        const name = m ? m[1] : (type === 'excel' ? 'export.xlsx' : 'export.md');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
        res.className = 'mt-2 small text-success';
        res.textContent = '✔ Download iniciado!';
      });
    })
    .catch(e => {
      res.className = 'mt-2 small text-danger';
      res.textContent = '✘ ' + e.message;
    });
}

// Limpa resultado ao abrir o modal
document.getElementById('exportModal').addEventListener('show.bs.modal', () => {
  document.getElementById('exp-result').className = 'mt-2 small d-none';
  document.getElementById('exp-result').textContent = '';
});
</script>

<!-- ── Modal: Executar tarefa ──────────────────────────────────────────────── -->
<div class="modal fade" id="runModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-play-circle-fill text-info me-2"></i>Executar tarefa
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- Opções -->
        <div class="row g-2 mb-3 align-items-end">
          <div class="col-sm-4">
            <label class="form-label small text-muted mb-1">Ação</label>
            <select id="run-action" class="form-select form-select-sm" onchange="onRunActionChange()">
              <option value="scrape">🔍 Scrape — buscar novas vagas</option>
              <option value="enrich">📄 Enriquecer descrições</option>
              <option value="rescore">🔄 Re-calcular scores</option>
              <option value="ai_enrich">🤖 IA — ajustar scores com Gemini</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label small text-muted mb-1">Perfil</label>
            <select id="run-profile" class="form-select form-select-sm">
              <option value="">Todos os perfis</option>
              {% for p in profile_names %}
              <option value="{{ p }}">{{ p }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Opções extras: scrape -->
          <div id="run-extra-scrape" class="col-sm-5">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="run-full-desc">
              <label class="form-check-label small" for="run-full-desc">
                Buscar descrições completas <span class="text-muted">(mais lento)</span>
              </label>
            </div>
          </div>

          <!-- Opções extras: enrich -->
          <div id="run-extra-enrich" class="col-sm-5 d-none">
            <label class="form-label small text-muted mb-1">Score mínimo</label>
            <input type="number" id="run-min-score" class="form-control form-control-sm"
                   value="60" min="0" max="100">
          </div>
        </div>

        <!-- Painel de log (oculto até iniciar) -->
        <div id="run-log-wrap" class="d-none">
          <label class="form-label small text-muted mb-1">
            <i class="bi bi-terminal me-1"></i>Log de execução
          </label>
          <div id="run-log"
               class="rounded p-3 font-monospace small text-white"
               style="background:#1a1a2e; height:300px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;">
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <div id="run-result" class="me-auto small d-none"></div>
        <button id="run-refresh-btn"
                class="btn btn-outline-primary btn-sm d-none"
                onclick="location.reload()">
          <i class="bi bi-arrow-clockwise me-1"></i>Atualizar página
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm"
                data-bs-dismiss="modal">Fechar</button>
        <button id="run-btn" class="btn btn-info btn-sm text-white fw-semibold"
                onclick="startRun()">
          <i class="bi bi-play-fill me-1"></i>Executar
        </button>
      </div>

    </div>
  </div>
</div>

<script>
// ── Run Modal ─────────────────────────────────────────────────────────────────
let _runTaskId       = null;
let _runPollTimer    = null;
let _runLogFrom      = 0;

function onRunActionChange() {
  const v = document.getElementById('run-action').value;
  document.getElementById('run-extra-scrape').classList.toggle('d-none', v !== 'scrape');
  document.getElementById('run-extra-enrich').classList.toggle('d-none', v !== 'enrich' && v !== 'ai_enrich');
}

function _resetRunModal() {
  _runTaskId    = null;
  _runLogFrom   = 0;
  if (_runPollTimer) { clearInterval(_runPollTimer); _runPollTimer = null; }
  document.getElementById('run-log').textContent = '';
  document.getElementById('run-log-wrap').classList.add('d-none');
  document.getElementById('run-result').classList.add('d-none');
  document.getElementById('run-refresh-btn').classList.add('d-none');
  const btn = document.getElementById('run-btn');
  btn.disabled  = false;
  btn.innerHTML = '<i class="bi bi-play-fill me-1"></i>Executar';
}

// Reset quando o modal abre
document.getElementById('runModal').addEventListener('show.bs.modal', _resetRunModal);

function startRun() {
  const action    = document.getElementById('run-action').value;
  const profile   = document.getElementById('run-profile').value;
  const fullDesc  = document.getElementById('run-full-desc').checked;
  const minScore  = parseInt(document.getElementById('run-min-score').value) || 0;

  // Mostra log, desabilita botão
  document.getElementById('run-log-wrap').classList.remove('d-none');
  document.getElementById('run-result').classList.add('d-none');
  document.getElementById('run-refresh-btn').classList.add('d-none');
  document.getElementById('run-log').textContent = '';
  _runLogFrom = 0;

  const btn = document.getElementById('run-btn');
  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Rodando…';

  fetch('/api/run', {
    method:  'POST',
    headers: {'Content-Type': 'application/json'},
    body:    JSON.stringify({
      action,
      profile:    profile || null,
      full_desc:  fullDesc,
      min_score:  minScore,
    }),
  })
  .then(r => r.json())
  .then(d => {
    if (d.error) { _showRunError(d.error); return; }
    _runTaskId  = d.task_id;
    _runPollTimer = setInterval(_pollRun, 1000);
  })
  .catch(e => _showRunError(String(e)));
}

function _appendLog(lines) {
  const el = document.getElementById('run-log');
  lines.forEach(line => {
    el.textContent += line + '\n';
  });
  el.scrollTop = el.scrollHeight;
}

function _pollRun() {
  if (!_runTaskId) return;
  fetch(`/api/run/${_runTaskId}?from=${_runLogFrom}`)
  .then(r => r.json())
  .then(d => {
    if (d.lines && d.lines.length) {
      _appendLog(d.lines);
      _runLogFrom = d.total_lines;
    }
    if (d.status !== 'running') {
      clearInterval(_runPollTimer);
      _runPollTimer = null;

      const btn = document.getElementById('run-btn');
      btn.disabled  = false;
      btn.innerHTML = '<i class="bi bi-play-fill me-1"></i>Executar';

      const res = document.getElementById('run-result');
      res.classList.remove('d-none');
      if (d.status === 'done') {
        res.innerHTML = '<span class="text-success fw-semibold">'
          + '<i class="bi bi-check-circle-fill me-1"></i>Concluído!</span>';
        document.getElementById('run-refresh-btn').classList.remove('d-none');
      } else {
        _showRunError(d.error || 'Erro desconhecido');
      }
    }
  })
  .catch(e => { /* ignora erros de rede transitórios */ });
}

function _showRunError(msg) {
  const btn = document.getElementById('run-btn');
  btn.disabled  = false;
  btn.innerHTML = '<i class="bi bi-play-fill me-1"></i>Executar';
  const res = document.getElementById('run-result');
  res.classList.remove('d-none');
  res.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle-fill me-1"></i>${msg}</span>`;
}
</script>

</body>
</html>
